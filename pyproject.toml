[project]
name = "mitigata"
version = "0.1.0"
description = "Deterministic, scope-enforced multi-agent penetration testing engine"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "structlog>=24.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "networkx>=3.3",
]

[project.scripts]
mitigata = "mitigata.cli:main"

[dependency-groups]
dev = ["pytest>=8.2", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mitigata"]

[tool.hatch.build.targets.wheel.force-include]
"frontend" = "mitigata/frontend"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
